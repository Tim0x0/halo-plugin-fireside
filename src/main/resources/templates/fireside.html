<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 聚合页大量引用友链站点图片，不发 Referer 以绕开对方防盗链 -->
  <meta name="referrer" content="no-referrer">
  <!-- 防闪烁：首帧前应用配色（访客本地选择 > 站长默认），CSS 据 data-fs-scheme 分档 -->
  <script th:inline="javascript">
    (function () {
      var scheme = /*[[${display.effectiveColorScheme()}]]*/ 'auto';
      var allowToggle = /*[[${display.effectiveAllowSchemeToggle()}]]*/ true;
      if (allowToggle) {
        try {
          var saved = localStorage.getItem('fireside.scheme');
          if (saved === 'auto' || saved === 'light' || saved === 'dark') {
            scheme = saved;
          }
        } catch (e) { /* 隐私模式下 localStorage 不可用，忽略 */ }
      }
      document.documentElement.setAttribute('data-fs-scheme', scheme);
      // 同步官方评论组件的配色契约（其 var.css 按 data-color-scheme 切换 --halo-cw-* 变量）
      document.documentElement.setAttribute('data-color-scheme', scheme);
    })();
  </script>
  <title th:text="${display.effectivePageTitle() + ' ' + display.effectiveTitleSeparator() + ' ' + site.title}">围炉</title>
  <link rel="icon" type="image/x-icon" th:href="${site.favicon}">
  <link rel="stylesheet"
        th:href="@{/plugins/plugin-fireside/assets/static/fireside.css?v={version}(version=${pluginVersion})}">
</head>
<body>
  <main class="fireside-container">
    <!-- 封面区：仿微信朋友圈头部（封面图 + 右下角昵称与头像悬挂） -->
    <header class="fireside-cover">
      <img th:if="${!#strings.isEmpty(display.coverImage)}"
           class="fireside-cover-img"
           th:src="${display.coverImage}"
           alt="封面图">
      <div th:if="${#strings.isEmpty(display.coverImage)}"
           class="fireside-cover-img fireside-cover-default"></div>
      <!-- 返回站点首页 -->
      <a class="fireside-home" th:href="@{/}" title="返回首页">
        <svg class="fireside-icon" viewBox="0 0 256 256" aria-hidden="true"><path d="m222.14 105.85l-80-80a20 20 0 0 0-28.28 0l-80 80A19.86 19.86 0 0 0 28 120v96a12 12 0 0 0 12 12h64a12 12 0 0 0 12-12v-52h24v52a12 12 0 0 0 12 12h64a12 12 0 0 0 12-12v-96a19.86 19.86 0 0 0-5.86-14.15M204 204h-40v-52a12 12 0 0 0-12-12h-48a12 12 0 0 0-12 12v52H52v-82.35l76-76l76 76Z"/></svg>
      </a>
      <!-- 发瞬间入口（仿朋友圈封面右上角相机）。三层显隐：
           设置开关(SSR) → 已登录(SSR，匿名访客无此节点) → 有 UC 发布权限(JS 探测后显示) -->
      <button type="button" id="fs-compose-entry" class="fireside-compose-entry" hidden
              th:if="${display.effectiveShowComposeEntry()}"
              sec:authorize="isAuthenticated()"
              title="发瞬间">
        <svg class="fireside-icon" viewBox="0 0 256 256" aria-hidden="true"><path d="M208 56h-27.72l-13.63-20.44A12 12 0 0 0 156.67 30h-57.34a12 12 0 0 0-9.98 5.34L75.72 56H48a28 28 0 0 0-28 28v108a28 28 0 0 0 28 28h160a28 28 0 0 0 28-28V84a28 28 0 0 0-28-28m4 136a4 4 0 0 1-4 4H48a4 4 0 0 1-4-4V84a4 4 0 0 1 4-4h34.14a12 12 0 0 0 9.98-5.34L105.75 54h44.5l13.63 20.44a12 12 0 0 0 9.98 5.56H208a4 4 0 0 1 4 4Zm-84-96a48 48 0 1 0 48 48a48.05 48.05 0 0 0-48-48m0 72a24 24 0 1 1 24-24a24 24 0 0 1-24 24"/></svg>
      </button>
      <div class="fireside-profile">
        <span class="fireside-profile-name" th:text="${site.title}">站点名称</span>
        <img th:if="${!#strings.isEmpty(site.logo)}"
             class="fireside-profile-avatar"
             th:src="${site.logo}"
             th:alt="${site.title}">
        <span th:if="${#strings.isEmpty(site.logo)}"
              class="fireside-profile-avatar fireside-profile-avatar-fallback"
              th:text="${#strings.substring(site.title, 0, 1)}">站</span>
      </div>
    </header>

    <!-- 签名：右对齐显示在头像下方（仿朋友圈签名位，站点一句话描述） -->
    <div class="fireside-signature"
         th:if="${!#strings.isEmpty(display.signature)}"
         th:text="${display.signature}">个性签名</div>

    <!-- 标签筛选：全部 + 各标签（含友链标签，固定末位），单行横向滑动 -->
    <nav class="fireside-tags">
      <a class="fireside-tag"
         th:classappend="${tag == ''} ? 'fireside-tag-active'"
         th:href="@{/fireside}">全部</a>
      <a class="fireside-tag"
         th:each="t : ${tags}"
         th:classappend="${tag == t.name} ? 'fireside-tag-active'"
         th:href="@{/fireside(tag=${t.name})}">
        <span th:text="${t.name}">标签</span><sup class="fireside-tag-count"
              th:text="${t.momentCount}">0</sup>
      </a>
    </nav>

    <!-- 时间线容器 -->
    <div id="fs-timeline">
      <th:block th:each="moment : ${moments.items}">
        <article class="fireside-card"
                 th:attr="data-external=${moment.external} ? '' : null">
          <!-- 头部：头像 + 作者（无头像/加载失败时回退首字占位） -->
          <div class="fireside-card-header">
            <span class="fireside-avatar fireside-avatar-fallback"
                  th:hidden="${!#strings.isEmpty(moment.owner.avatar)}"
                  th:text="${#strings.isEmpty(moment.owner.displayName) ? '?' : #strings.substring(moment.owner.displayName, 0, 1)}">友</span>
            <img th:if="${!#strings.isEmpty(moment.owner.avatar)}"
                 class="fireside-avatar"
                 th:src="${moment.owner.avatar}"
                 th:alt="${moment.owner.displayName}"
                 loading="lazy"
                 onerror="this.hidden=true;this.previousElementSibling.hidden=false">
            <div class="fireside-card-meta">
              <div class="fireside-card-author">
                <span th:if="!${moment.external}"
                      class="fireside-author-name"
                      th:text="${moment.owner.displayName}">作者</span>
                <a th:if="${moment.external}"
                   class="fireside-author-name fireside-author-link"
                   th:href="${moment.authorUrl}"
                   th:text="${moment.owner.displayName}"
                   target="_blank"
                   rel="noopener nofollow noreferrer">作者</a>
                <span th:if="${moment.external}"
                      class="fireside-badge"
                      title="来自友链订阅">订阅</span>
              </div>
            </div>
          </div>

          <!-- 正文 -->
          <div class="fireside-card-content"
               th:if="${moment.spec.content.html != null and !moment.spec.content.html.isEmpty()}"
               th:utext="${moment.spec.content.html}">正文内容</div>

          <!-- 媒体区：按 type 渲染图/视频/音频；图片点击交给外部灯箱插件接管 -->
          <div class="fireside-media"
               th:if="${!moment.spec.content.medium.isEmpty()}">
            <th:block th:each="item : ${moment.spec.content.medium}">
              <div class="fireside-media-item"
                   th:classappend="${moment.spec.content.medium.size() > 1} ? 'fireside-media-grid' : 'fireside-media-single'">
                <img th:if="${item.type == null or item.type.name() == 'PHOTO' or item.type.name() == 'POST'}"
                     th:src="${item.url}"
                     th:alt="${moment.title ?: '图片'}"
                     loading="lazy"
                     referrerpolicy="no-referrer">
                <video th:if="${item.type != null and item.type.name() == 'VIDEO'}"
                       th:src="${item.url}"
                       controls
                       playsinline
                       preload="metadata"
                       referrerpolicy="no-referrer"></video>
                <audio th:if="${item.type != null and item.type.name() == 'AUDIO'}"
                       th:src="${item.url}"
                       controls
                       preload="metadata"
                       referrerpolicy="no-referrer"></audio>
              </div>
            </th:block>
          </div>

          <!-- 标签行：独立于时间行，多标签自由折行互不影响对齐 -->
          <div class="fireside-card-tags"
               th:if="${moment.spec.tags != null and !moment.spec.tags.isEmpty()}">
            <th:block th:each="tag : ${moment.spec.tags}">
              <a class="fireside-card-tag"
                 th:href="@{/fireside(tag=${tag})}"
                 th:text="${tag}">标签</a>
            </th:block>
          </div>

          <!-- 底部：时间 + 互动/原文链接（时间在底部，与朋友圈一致） -->
          <div class="fireside-card-footer">
            <!-- 自身瞬间的时间戳链去内置详情页；友链条目纯展示 -->
            <a th:if="!${moment.external}"
               class="fireside-card-time-link"
               th:href="@{'/fireside/' + ${moment.metadata.name}}">
              <time class="fireside-card-time"
                    th:datetime="${moment.spec.releaseTime}"
                    th:title="${#temporals.format(moment.spec.releaseTime, 'yyyy-MM-dd HH:mm')}"
                    th:text="${#temporals.format(moment.spec.releaseTime, 'yyyy-MM-dd HH:mm')}">2026-01-01 00:00</time>
            </a>
            <!-- 私密瞬间小锁（仿朋友圈时间旁）：私密内容仅作者登录可见，锁只会出现在作者眼前 -->
            <span th:if="${!moment.external and moment.spec.visible != null and moment.spec.visible.name() == 'PRIVATE'}"
                  class="fireside-private-lock" title="仅自己可见">
              <svg class="fireside-icon" viewBox="0 0 256 256" aria-hidden="true"><path d="M208,76H180V56A52,52,0,0,0,76,56V76H48A20,20,0,0,0,28,96V208a20,20,0,0,0,20,20H208a20,20,0,0,0,20-20V96A20,20,0,0,0,208,76ZM100,56a28,28,0,0,1,56,0V76H100ZM204,204H52V100H204Z"/></svg>
            </span>
            <time th:if="${moment.external}"
                  class="fireside-card-time"
                  th:datetime="${moment.spec.releaseTime}"
                  th:title="${#temporals.format(moment.spec.releaseTime, 'yyyy-MM-dd HH:mm')}"
                  th:text="${#temporals.format(moment.spec.releaseTime, 'yyyy-MM-dd HH:mm')}">2026-01-01 00:00</time>
            <!-- 自身瞬间：点赞 + 评论 + 复制链接 -->
            <div class="fireside-actions" th:if="!${moment.external}">
              <button type="button" class="fireside-action fireside-like"
                      th:attr="data-name=${moment.metadata.name}"
                      title="点赞">
                <svg class="fireside-icon fireside-icon-heart" viewBox="0 0 256 256" aria-hidden="true"><path d="M178 36c-20.09 0-37.92 7.93-50 21.56C115.92 43.93 98.09 36 78 36a66.08 66.08 0 0 0-66 66c0 72.34 105.81 130.14 110.31 132.57a12 12 0 0 0 11.38 0C138.19 232.14 244 174.34 244 102a66.08 66.08 0 0 0-66-66m-5.49 142.36a328.7 328.7 0 0 1-44.51 31.8a328.7 328.7 0 0 1-44.51-31.8C61.82 159.77 36 131.42 36 102a42 42 0 0 1 42-42c17.8 0 32.7 9.4 38.89 24.54a12 12 0 0 0 22.22 0C145.3 69.4 160.2 60 178 60a42 42 0 0 1 42 42c0 29.42-25.82 57.77-47.49 76.36"/></svg>
                <svg class="fireside-icon fireside-icon-heart-fill" viewBox="0 0 256 256" aria-hidden="true"><path d="M240 102c0 70-103.79 126.66-108.21 129a8 8 0 0 1-7.58 0C119.79 228.66 16 172 16 102a62.07 62.07 0 0 1 62-62c20.65 0 38.73 8.88 50 23.89C139.27 48.88 157.35 40 178 40a62.07 62.07 0 0 1 62 62"/></svg>
                <span class="fireside-like-count" th:text="${moment.stats.upvote}">0</span>
              </button>
              <button type="button" class="fireside-action fireside-comment-toggle"
                      th:attr="data-name=${moment.metadata.name}"
                      title="评论">
                <svg class="fireside-icon" viewBox="0 0 256 256" aria-hidden="true"><path d="M128 20a108 108 0 0 0-96.15 157.23L21 209.66A20 20 0 0 0 46.34 235l32.43-10.81A108 108 0 1 0 128 20m0 192a84 84 0 0 1-42.06-11.27a12 12 0 0 0-6-1.62a12.1 12.1 0 0 0-3.8.62l-29.79 9.93l9.93-29.79a12 12 0 0 0-1-9.81A84 84 0 1 1 128 212"/></svg>
                <span th:text="${moment.stats.approvedComment}">0</span>
              </button>
              <button type="button" class="fireside-action fireside-copy"
                      th:attr="data-path='/fireside/' + ${moment.metadata.name}"
                      title="复制链接">
                <svg class="fireside-icon" viewBox="0 0 256 256" aria-hidden="true"><path d="M117.18 188.74a12 12 0 0 1 0 17l-5.12 5.12A58.26 58.26 0 0 1 70.6 228a58.62 58.62 0 0 1-41.46-100.08l34.75-34.75a58.64 58.64 0 0 1 98.56 28.11a12 12 0 1 1-23.37 5.44a34.65 34.65 0 0 0-58.22-16.58l-34.75 34.75A34.62 34.62 0 0 0 70.57 204a34.4 34.4 0 0 0 24.49-10.14l5.11-5.12a12 12 0 0 1 17.01 0M226.83 45.17a58.65 58.65 0 0 0-82.93 0l-5.11 5.11a12 12 0 0 0 17 17l5.12-5.12a34.63 34.63 0 1 1 49 49l-34.81 34.7A34.4 34.4 0 0 1 150.61 156a34.63 34.63 0 0 1-33.69-26.72a12 12 0 0 0-23.38 5.44A58.64 58.64 0 0 0 150.56 180h.05a58.28 58.28 0 0 0 41.47-17.17l34.75-34.75a58.62 58.62 0 0 0 0-82.91"/></svg>
              </button>
            </div>
            <a th:if="${moment.external}"
               class="fireside-source"
               th:href="${moment.sourceUrl}"
               target="_blank"
               rel="noopener nofollow noreferrer">查看原文</a>
          </div>

          <!-- 自身瞬间的评论区：与官方主题（theme-earth 瞬间页）同款——
               服务端 halo:comment 标签渲染，默认隐藏，点评论按钮切换显示 -->
          <div class="fireside-comments" hidden
               th:if="!${moment.external}"
               th:attr="data-name=${moment.metadata.name}, id='fs-comment-' + ${moment.metadata.name}">
            <halo:comment group="moment.halo.run" kind="Moment" th:attr="name=${moment.metadata.name}" />
          </div>
        </article>
      </th:block>

      <!-- 空态 -->
      <div th:if="${moments.items.isEmpty()}" class="fireside-empty">
        <p>暂时没有动态</p>
      </div>
    </div>

    <!-- 分页：游标式"更早的动态"（每一页都是完整 SSR，评论走官方组件） -->
    <nav class="fireside-pager"
         th:if="${!#strings.isEmpty(olderUrl) or !#strings.isEmpty(latestUrl)}">
      <a th:if="${!#strings.isEmpty(latestUrl)}"
         th:href="${latestUrl}">回到最新</a>
      <a th:if="${!#strings.isEmpty(olderUrl)}"
         th:href="${olderUrl}">更早的动态</a>
    </nav>

    <!-- 页脚：版权行 + 项目链接 -->
    <footer class="fireside-footer">
      <p>© <span th:text="${#temporals.format(#temporals.createNow(), 'yyyy')}">2026</span>
        <span th:text="${site.title}">站点名称</span> ·
        Powered by <a href="https://github.com/Tim0x0/halo-plugin-fireside"
                      target="_blank" rel="noopener">Fireside</a></p>
    </footer>

    <!-- 发瞬间浮层：与入口同门槛（设置开关 + 登录），匿名访客零 DOM。
         发布走瞬间插件 UC API，服务端按角色决定是否需要审核 -->
    <div id="fs-compose" class="fireside-compose" hidden
         th:if="${display.effectiveShowComposeEntry()}"
         sec:authorize="isAuthenticated()">
      <div class="fireside-compose-mask" data-compose-close></div>
      <div class="fireside-compose-panel" role="dialog" aria-modal="true" aria-label="发瞬间">
        <!-- 顶栏：移动端仿微信发表页（取消|标题|发表），桌面端对话框（标题|×） -->
        <div class="fireside-compose-head">
          <button type="button" class="fireside-compose-cancel fireside-mobile-only" data-compose-close>取消</button>
          <span class="fireside-compose-title">发瞬间</span>
          <button type="button" class="fireside-compose-submit fireside-mobile-only">发表</button>
          <button type="button" class="fireside-compose-close fireside-desktop-only" data-compose-close title="关闭">
            <svg class="fireside-icon" viewBox="0 0 256 256" aria-hidden="true"><path d="M208.49 191.51a12 12 0 0 1-17 17L128 145l-63.51 63.49a12 12 0 0 1-17-17L111 128L47.51 64.49a12 12 0 0 1 17-17L128 111l63.51-63.52a12 12 0 0 1 17 17L145 128Z"/></svg>
          </button>
        </div>
        <textarea id="fs-compose-text" class="fireside-compose-text" rows="4"
                  maxlength="5000" placeholder="这一刻的想法…"></textarea>
        <!-- 标签联想条：正文打 #xx 未完成时浮现（UC 标签接口），点选或 ↑↓+Enter 补全 -->
        <div id="fs-compose-suggest" class="fireside-compose-suggest" hidden></div>
        <!-- 图片九宫格：预览项由 JS 注入到添加按钮之前，走 Halo UC 附件上传 -->
        <div id="fs-compose-media" class="fireside-compose-media">
          <button type="button" id="fs-compose-add" class="fireside-compose-add" title="添加图片">
            <svg class="fireside-icon" viewBox="0 0 256 256" aria-hidden="true"><path d="M228 128a12 12 0 0 1-12 12h-76v76a12 12 0 0 1-24 0v-76H40a12 12 0 0 1 0-24h76V40a12 12 0 0 1 24 0v76h76a12 12 0 0 1 12 12"/></svg>
          </button>
        </div>
        <input type="file" id="fs-compose-file" accept="image/*" multiple hidden>
        <!-- 设置行（仿微信发表页）：谁可以看 点击在 公开/私密 间切换；标签为可选输入 -->
        <button type="button" id="fs-compose-visible" class="fireside-compose-setting"
                title="私密瞬间仅自己登录后可见">
          <span class="fireside-compose-setting-label">谁可以看</span>
          <span class="fireside-compose-setting-value" id="fs-compose-visible-value">公开</span>
        </button>
        <!-- 标签行：正文 #标签 的实时投影（打完空格生效），× 联动删除正文里的对应文字 -->
        <div class="fireside-compose-setting">
          <span class="fireside-compose-setting-label">标签</span>
          <span id="fs-compose-tags" class="fireside-compose-tags"></span>
        </div>
        <p id="fs-compose-tip" class="fireside-compose-tip" hidden></p>
        <div class="fireside-compose-foot">
          <a class="fireside-compose-uc" href="/uc/moments">在个人中心管理瞬间 →</a>
          <button type="button" class="fireside-compose-submit fireside-desktop-only">发表</button>
        </div>
      </div>
    </div>

    <!-- 右下浮动列：配色切换（常驻）+ 返回顶部（滚过一屏出现） -->
    <div class="fireside-fabs">
      <button type="button" id="fs-top" class="fireside-fab fireside-fab-collapsed" title="返回顶部">
        <svg class="fireside-icon" viewBox="0 0 256 256" aria-hidden="true"><path d="M216.49 168.49a12 12 0 0 1-17 0L128 97l-71.51 71.49a12 12 0 0 1-17-17l80-80a12 12 0 0 1 17 0l80 80a12 12 0 0 1 0 17"/></svg>
      </button>
      <button type="button" id="fs-scheme" class="fireside-fab"
              th:if="${display.effectiveAllowSchemeToggle()}"
              title="配色：跟随系统">
        <svg class="fireside-icon fireside-scheme-auto" viewBox="0 0 256 256" aria-hidden="true"><path d="M128,20A108,108,0,1,0,236,128,108.12,108.12,0,0,0,128,20Zm0,192a84,84,0,1,1,84-84A84.09,84.09,0,0,1,128,212ZM128,44a84,84,0,0,1,0,168Z"/></svg>
        <svg class="fireside-icon fireside-scheme-sun" viewBox="0 0 256 256" aria-hidden="true"><path d="M116,36V20a12,12,0,0,1,24,0V36a12,12,0,0,1-24,0Zm80,92a68,68,0,1,1-68-68A68.07,68.07,0,0,1,196,128Zm-24,0a44,44,0,1,0-44,44A44.05,44.05,0,0,0,172,128ZM51.51,68.49a12,12,0,1,0,17-17l-12-12a12,12,0,0,0-17,17Zm0,119-12,12a12,12,0,0,0,17,17l12-12a12,12,0,1,0-17-17ZM196,72a12,12,0,0,0,8.49-3.51l12-12a12,12,0,0,0-17-17l-12,12A12,12,0,0,0,196,72Zm8.49,115.51a12,12,0,0,0-17,17l12,12a12,12,0,0,0,17-17ZM48,128a12,12,0,0,0-12-12H20a12,12,0,0,0,0,24H36A12,12,0,0,0,48,128Zm80,80a12,12,0,0,0-12,12v16a12,12,0,0,0,24,0V220A12,12,0,0,0,128,208Zm108-92H220a12,12,0,0,0,0,24h16a12,12,0,0,0,0-24Z"/></svg>
        <svg class="fireside-icon fireside-scheme-moon" viewBox="0 0 256 256" aria-hidden="true"><path d="M236.37,139.4a12,12,0,0,0-12-3A84.07,84.07,0,0,1,119.6,31.59a12,12,0,0,0-15-15A108.86,108.86,0,0,0,49.69,55.07,108,108,0,0,0,136,228a107.09,107.09,0,0,0,64.93-21.69,108.86,108.86,0,0,0,38.44-54.94A12,12,0,0,0,236.37,139.4Zm-49.88,47.74A84,84,0,0,1,68.86,69.51,84.93,84.93,0,0,1,92.27,48.29Q92,52.13,92,56A108.12,108.12,0,0,0,200,164q3.87,0,7.71-.27A84.79,84.79,0,0,1,186.49,187.14Z"/></svg>
      </button>
    </div>
