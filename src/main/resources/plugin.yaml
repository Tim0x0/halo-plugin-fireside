# Refer https://docs.halo.run/developer-guide/plugin/basics/manifest

apiVersion: plugin.halo.run/v1alpha1
kind: Plugin
metadata:
  # The name defines how the plugin is invoked, A unique name
  name: plugin-fireside
  annotations:
    # 应用市场（1.17.0+）安装/升级后据此提示安装前置应用与推荐应用
    # 链接管理：https://www.halo.run/store/apps/app-hfbQg
    "store.halo.run/required-apps": '["app-hfbQg"]'
    # 瞬间：https://www.halo.run/store/apps/app-SnwWD
    # 编辑器超链接卡片（富链接封面/标题）：https://www.halo.run/store/apps/app-UpUJA
    "store.halo.run/recommended-apps": '["app-SnwWD", "app-UpUJA"]'
spec:
  enabled: true
  requires: ">=2.25.0"
  author:
    name: Tim0x0
    website: https://github.com/Tim0x0
  logo: logo.png
  homepage: https://github.com/Tim0x0/halo-plugin-fireside#readme
  repo: https://github.com/Tim0x0/halo-plugin-fireside
  issues: https://github.com/Tim0x0/halo-plugin-fireside/issues
  displayName: "围炉"
  description: "聚合友链博主的说说、动态、瞬间，与你自己的瞬间混排成一条朋友圈式时间线，像刷朋友圈一样看到朋友们的近况"
  license:
    - name: "GPL-3.0"
      url: "https://github.com/Tim0x0/halo-plugin-fireside/blob/main/LICENSE"
  settingName: plugin-fireside-settings
  configMapName: plugin-fireside-configmap
  pluginDependencies:
    # 硬依赖：动态 RSS 地址元数据挂在链接插件的 Link 上
    "PluginLinks": ">=2.0.0"
    # 可选依赖：未装瞬间插件时时间线只含友链条目，插件不崩。
    # 1.16.0 起瞬间迁移到 Halo 2.22 的 typed 索引 API，本插件的查询按该形态编写，
    # 旧版瞬间的 String 索引与 Boolean 查询值不匹配会导致查询失败，故要求 >=1.16.0
    "PluginMoments?": ">=1.16.0"
    # 可选：前台富链接向其 link-detail 拉标题/封面；未装则仅显示占位壳
    "editor-hyperlink-card?": ">=1.0.0"
