apiVersion: v1alpha1
kind: Setting
metadata:
  name: plugin-fireside-settings
spec:
  forms:
    - group: display
      label: 展示设置
      formSchema:
        - $formkit: text
          name: pageTitle
          label: 页面标题
          value: 围炉
          help: 内置 /fireside 页标题，留空为「围炉」
        - $formkit: text
          name: detailPageTitle
          label: 详情页标题
          help: 详情页顶栏与浏览器标题，留空则跟随页面标题
        - $formkit: radio
          name: titleSeparator
          label: 标题分隔符
          value: '-'
          options:
            - label: '-'
              value: '-'
            - label: '|'
              value: '|'
          help: 浏览器标题分隔符，如「围炉 - 站点名」
        - $formkit: number
          name: pageSize
          label: 每页条数
          value: 20
          min: 10
          max: 100
          validation: required|min:10|max:100
          help: 每页条数，10~100；越大首屏越长
        - $formkit: text
          name: friendTag
          label: 友链动态标签
          value: 友链
          help: 友链动态标签名，无需 #；留空为「友链」。可用 ?tag=该名称筛选
        - $formkit: group
          name: appearance
          label: 外观
          children:
            - $formkit: attachment
              name: coverImage
              label: 封面图
              help: 顶部封面（建议横图），并用作列表分享预览图；留空为默认底且不输出分享图
            - $formkit: textarea
              name: signature
              label: 签名
              rows: 2
              help: 封面下签名，并用作列表 SEO/分享描述；留空则不显示也不输出描述
            - $formkit: radio
              name: colorScheme
              label: 配色方案
              value: auto
              options:
                - label: 跟随系统
                  value: auto
                - label: 浅色
                  value: light
                - label: 深色
                  value: dark
              help: 页面默认配色；若允许访客切换，以其本地选择为准
            - $formkit: checkbox
              name: allowSchemeToggle
              label: 允许访客切换配色
              value: true
              help: 右下角显示配色切换；关闭后固定为上方默认配色
        - $formkit: group
          name: interaction
          label: 互动
          children:
            - $formkit: number
              name: commentPreviewCount
              label: 评论预览条数
              value: 10
              min: -1
              max: 100
              validation: required|min:-1|max:100
              help: 卡片下预览的最新顶层评论数。0 关闭，-1 全部；超出显示「查看全部」
            - $formkit: checkbox
              name: showComposeEntry
              label: 显示发瞬间入口
              value: true
              help: 封面显示发瞬间入口。仅登录且有发布权限者可见；无免审核权限时需后台审核
    - group: sync
      label: 同步设置
      formSchema:
        - $formkit: checkbox
          name: enabled
          label: 启用定时同步
          value: true
          help: 关闭后停止定时抓取，已有数据保留
        - $formkit: number
          name: intervalMinutes
          label: 同步间隔（分钟）
          value: 60
          min: 5
          validation: required|min:5
          help: 抓取间隔，最小 5 分钟
        - $formkit: number
          name: maxLinksPerRun
          label: 每轮最多处理的友链数
          value: 20
          min: 1
          validation: required|min:1
          help: 每轮最多处理的友链数；大于订阅总数时相当于每轮全量
        - $formkit: number
          name: retainPerLink
          label: 每个友链保留的最新条数
          value: 20
          min: 1
          max: 100
          validation: required|min:1|max:100
          help: 每个友链保留的最新条数，1~100，超出删最旧
        - $formkit: number
          name: timeoutSeconds
          label: 抓取超时（秒）
          value: 10
          min: 1
          max: 60
          validation: required|min:1|max:60
          help: 单个 RSS 超时，1~60 秒
