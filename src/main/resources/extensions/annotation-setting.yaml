apiVersion: v1alpha1
kind: AnnotationSetting
metadata:
  # 必须用固定 name：Halo 对插件 extensions/ 资源按 metadata.name 做 create-or-update，
  # 用 generateName 会在每次插件启动/升级时重复创建一份，导致链接表单字段翻倍
  name: fireside-link-annotation-setting
spec:
  targetRef:
    group: core.halo.run
    kind: Link
  formSchema:
    - $formkit: url
      name: fireside_rss_url
      label: 动态 RSS 地址
      validation: url
      help: 留空不订阅；清空已有地址将删除该友链全部动态。
    - $formkit: checkbox
      name: fireside_paused
      label: 暂停同步
      help: 暂停抓取，保留已有动态。
