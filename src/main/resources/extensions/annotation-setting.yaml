apiVersion: v1alpha1
kind: AnnotationSetting
metadata:
  # 必须用固定 name：Halo 对插件 extensions/ 资源按 metadata.name 做 create-or-update，
  # 用 generateName 会在每次插件启动/升级时重复创建一份，导致链接表单字段翻倍
  name: fireside-link-annotation-setting
spec:
  targetRef:
    group: core.halo.run
    kind: Link
  formSchema:
    - $formkit: url
      name: fireside_rss_url
      label: 动态 RSS 地址
      validation: url
      help: 填写对方站点任意 RSS/Atom 地址，填写后其动态将进入朋友圈时间线；留空则不订阅。（若对方为 Halo 且装有瞬间+RSS 插件，其瞬间 RSS 一般为 https://对方域名/feed/moments/rss.xml，仅供参考）
    - $formkit: checkbox
      name: fireside_paused
      label: 暂停同步
      help: 勾选后暂停抓取该友链的动态，已抓取的数据保留并继续展示；取消勾选恢复同步。（清空 RSS 地址则会删除该友链的全部动态）
