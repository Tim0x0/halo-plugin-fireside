apiVersion: v1alpha1
kind: Role
metadata:
  name: role-template-fireside-view
  labels:
    halo.run/role-template: "true"
  annotations:
    rbac.authorization.halo.run/module: "围炉"
    rbac.authorization.halo.run/display-name: "围炉查看"
    rbac.authorization.halo.run/ui-permissions: |
      ["plugin:fireside:view"]
rules:
  # 管理页只读：条目流、同步状态徽章
  - apiGroups: [ "fireside.timxs.com" ]
    resources: [ "friendmoments", "feedstatuses" ]
    verbs: [ "get", "list" ]
  # 管理页读取友链列表（订阅侧边栏）
  - apiGroups: [ "core.halo.run" ]
    resources: [ "links" ]
    verbs: [ "get", "list" ]
---
apiVersion: v1alpha1
kind: Role
metadata:
  name: role-template-fireside-manage
  labels:
    halo.run/role-template: "true"
  annotations:
    rbac.authorization.halo.run/module: "围炉"
    rbac.authorization.halo.run/display-name: "围炉管理"
    rbac.authorization.halo.run/ui-permissions: |
      ["plugin:fireside:manage"]
    rbac.authorization.halo.run/dependencies: |
      ["role-template-fireside-view"]
rules:
  # 条目管理（隐藏/恢复/删除）
  - apiGroups: [ "fireside.timxs.com" ]
    resources: [ "friendmoments", "feedstatuses" ]
    verbs: [ "create", "patch", "update", "delete", "deletecollection" ]
  # 手动同步、清空与全部已读（子资源动作）
  - apiGroups: [ "console.api.fireside.timxs.com" ]
    resources: [ "links/sync", "links/clear-moments", "links/mark-read" ]
    verbs: [ "create" ]
  # 切换暂停注解需要写 Link
  - apiGroups: [ "core.halo.run" ]
    resources: [ "links" ]
    verbs: [ "update", "patch" ]
---
apiVersion: v1alpha1
kind: Role
metadata:
  name: role-template-fireside-anonymous
  labels:
    halo.run/role-template: "true"
    halo.run/hidden: "true"
    rbac.authorization.halo.run/aggregate-to-anonymous: "true"
rules:
  # 公开时间线 API（主题前端 JS 无限滚动），输出仅公开内容
  - apiGroups: [ "api.fireside.timxs.com" ]
    resources: [ "timeline" ]
    verbs: [ "get", "list" ]
